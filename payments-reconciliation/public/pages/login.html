<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <h1>Payments Reconciliation</h1>

    <p class="subtitle">
      Admin & Staff Login
    </p>

    <div
      id="messageBox"
      class="message-box"
    ></div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

  </div>

  <script src="../js/main.js"></script>

</body>
</html>
